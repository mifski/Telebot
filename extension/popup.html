<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #fff4f8;
      --bg-2: #f1f0ff;
      --card: #ffffff;
      --ink: #5b4a58;
      --ink-soft: #a08fa0;
      --pink: #ffb3d1;
      --pink-deep: #ff86b8;
      --lilac: #cbb8ff;
      --mint: #a8e6cf;
      --lemon: #ffe6a7;
      --line: #f3e3ec;
      --ok-bg: #e6f9ef;   --ok-ink: #3f8f6a;
      --warn-bg: #fff4dc; --warn-ink: #a1783a;
      --err-bg: #ffe9ef;  --err-ink: #b85c7c;
      --info-bg: #f2effd; --info-ink: #6f5fa8;
      --radius: 18px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #2a2333; --bg-2: #241f2e; --card: #332b3f;
        --ink: #f6eaf3; --ink-soft: #b9a8c4; --line: #443a52;
        --ok-bg: #2c4a3c;   --ok-ink: #b6f0d2;
        --warn-bg: #4d4029; --warn-ink: #ffe0a3;
        --err-bg: #4d2f3c;  --err-ink: #ffc2d6;
        --info-bg: #383056; --info-ink: #d8cdff;
      }
    }

    * { box-sizing: border-box; }

    body {
      width: 328px;
      margin: 0;
      padding: 16px 16px 18px;
      color: var(--ink);
      background: linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
      font-family: 'Segoe UI Rounded', 'SF Pro Rounded', ui-rounded, -apple-system,
                   BlinkMacSystemFont, 'Segoe UI', 'Nunito', sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ── header ─────────────────────────── */
    .hero {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px;
    }
    .blob {
      width: 42px; height: 42px; flex: none;
      border-radius: 50% 50% 48% 52% / 52% 48% 52% 48%;
      background: linear-gradient(145deg, var(--pink), var(--lilac));
      display: grid; place-items: center;
      font-size: 20px;
      box-shadow: 0 6px 14px rgba(255, 134, 184, .35);
      animation: bob 3.2s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%      { transform: translateY(-4px) rotate(4deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .blob { animation: none; }
    }
    .hero h1 {
      margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .2px;
    }
    .hero p { margin: 1px 0 0; font-size: 11px; color: var(--ink-soft); }

    /* ── cards ──────────────────────────── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 13px 14px;
      margin-bottom: 11px;
      box-shadow: 0 3px 10px rgba(142, 110, 140, .10);
    }

    #connection {
      border-radius: var(--radius);
      padding: 11px 13px;
      margin-bottom: 11px;
      background: var(--info-bg);
      color: var(--info-ink);
      font-size: 12px;
      font-weight: 600;
    }
    #connection.ok   { background: var(--ok-bg);   color: var(--ok-ink); }
    #connection.warn { background: var(--warn-bg); color: var(--warn-ink); }

    label {
      display: block; margin-bottom: 6px;
      font-size: 11px; font-weight: 700;
      color: var(--ink-soft); letter-spacing: .4px; text-transform: uppercase;
    }
    input {
      width: 100%; padding: 10px 12px;
      border: 2px solid var(--line); border-radius: 13px;
      background: var(--card); color: var(--ink);
      font-size: 13px; font-family: inherit;
      transition: border-color .18s, box-shadow .18s;
    }
    input::placeholder { color: var(--ink-soft); opacity: .7; }
    input:focus {
      outline: none;
      border-color: var(--pink);
      box-shadow: 0 0 0 4px rgba(255, 179, 209, .28);
    }
    small { display: block; margin-top: 6px; font-size: 11px; color: var(--ink-soft); }

    /* ── buttons ────────────────────────── */
    button {
      width: 100%; margin-top: 9px; padding: 11px 12px;
      border: none; border-radius: 14px;
      font-family: inherit; font-size: 13px; font-weight: 700;
      color: var(--ink); cursor: pointer;
      transition: transform .12s ease, filter .18s, box-shadow .18s;
    }
    button:hover  { filter: brightness(1.04); box-shadow: 0 5px 14px rgba(142, 110, 140, .22); }
    button:active { transform: scale(.97); }
    .btn-primary   { background: linear-gradient(135deg, var(--pink), var(--pink-deep)); color: #fff; }
    .btn-secondary { background: linear-gradient(135deg, #efeaff, var(--lilac)); }
    .btn-success   { background: linear-gradient(135deg, #d5f5e6, var(--mint)); }
    .btn-danger    { background: linear-gradient(135deg, #fff0f3, #ffc9d8); }
    @media (prefers-color-scheme: dark) {
      .btn-secondary, .btn-success, .btn-danger { color: #3a2f44; }
    }

    /* ── status ─────────────────────────── */
    #status {
      margin: 2px 0 2px; padding: 12px;
      border-radius: var(--radius);
      text-align: center; font-weight: 700; font-size: 13px;
    }
    #status.active   { background: var(--ok-bg);  color: var(--ok-ink); }
    #status.inactive { background: var(--err-bg); color: var(--err-ink); }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

    #message {
      margin-top: 10px; padding: 10px 12px;
      border-radius: 13px; font-size: 12px; font-weight: 600;
      word-wrap: break-word; overflow-wrap: anywhere;
    }
    #message.ok    { background: var(--ok-bg);   color: var(--ok-ink); }
    #message.error { background: var(--err-bg);  color: var(--err-ink); }
    #message.info  { background: var(--info-bg); color: var(--info-ink); }

    details { margin-top: 11px; }
    details summary {
      font-size: 11px; font-weight: 700; color: var(--ink-soft);
      cursor: pointer; list-style: none; padding: 3px 0;
    }
    details summary::-webkit-details-marker { display: none; }
    details summary::before { content: "⚙︎ "; }
    details[open] summary { margin-bottom: 9px; }

    footer {
      margin-top: 13px; text-align: center;
      font-size: 10px; color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="blob">♪</div>
    <div>
      <h1>YouTube → Telegram</h1>
      <p>your listening diary, posted for you ♡</p>
    </div>
  </header>

  <div id="connection">(・・?) not connected yet</div>

  <div class="card">
    <label for="code">your secret code</label>
    <input type="text" id="code" placeholder="paste the code from /connect"
           autocomplete="off" spellcheck="false" />
    <small>send <b>/connect</b> to the bot on Telegram to get it ♡</small>

    <button id="saveConfig" class="btn-primary">♡ save &amp; connect</button>
    <button id="testBtn" class="btn-secondary">✉︎ send a test post</button>

    <details>
      <summary>advanced</summary>
      <label for="serverUrl">bot server URL</label>
      <input type="text" id="serverUrl" placeholder="https://your-bot.up.railway.app" />
      <small>already filled in for you — only change it if your bot moved house</small>
    </details>
  </div>

  <div class="card">
    <div id="status" class="inactive">⏸ napping…</div>
    <button id="startBtn" class="btn-success">▶ start listening</button>
    <button id="stopBtn" class="btn-danger">⏹ take a break</button>
    <div id="message" hidden></div>
  </div>

  <footer>made with ♡ · videos post after 10s of playtime</footer>

  <script src="popup.js"></script>
</body>
</html>
